[servers]
node1 ansible_host=localhost ansible_port=2221
node2 ansible_host=localhost ansible_port=2222
node3 ansible_host=localhost ansible_port=2223
node4 ansible_host=localhost ansible_port=2224

[servers:vars]
ansible_user=root
ansible_ssh_private_key_file=~/.ssh/chef-key
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o IdentitiesOnly=yes'
